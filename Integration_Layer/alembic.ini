; Alembic configuration for the Integration Layer.
;
; The database URL is intentionally NOT set here. It is injected at runtime
; by `migrations/env.py` from `app.core.config.Settings` so there is exactly
; one source of truth for connection settings.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 1

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 1

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
