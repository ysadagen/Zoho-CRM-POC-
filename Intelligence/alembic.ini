; Alembic configuration for the Intelligence service.
;
; The database URL is injected at runtime by migrations/env.py from
; app.core.config.Settings (one source of truth). This service shares the
; database with the Backend but tracks its own migrations in a dedicated
; version table (alembic_version_intelligence) so the two chains never clash.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
propagate = 1

[logger_alembic]
level = INFO
handlers =
qualname = alembic
propagate = 1

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
